<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeTimer</title>

<meta http-equiv="Content-Security-Policy" content="default-src *; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data:">

    <link href="lib/bootstrap/bootstrap-5.3.0-alpha3-dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="lib/fontawesome/css/all.min.css" rel="stylesheet" />
    <script src="lib/bootstrap/bootstrap-5.3.0-alpha3-dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/jquery/dist/jquery.min.js"></script>
    <link href="style.css" rel="stylesheet"/>

    <link href="lib/select2/dist/css/select2.min.css" rel="stylesheet"/>
    <link href="lib/select2/select2-bootstrap-5-theme.min.css" rel="stylesheet"/>
    <scrpt src="lib/select2/dist/js/select2.min.js"></scrpt>
    <script src="lib/moment/moment.min.js"></script>

  </head>
  <body data-bs-theme="dark">
    <!-- Modal -->     
    <div class="modal modal-sm fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="text-end mx-2 my-1">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="loading fs-5 py-2">
                        <span class="spinner-border spinner-border" role="status" aria-hidden="true"></span>
                    </div>
                    Loading...
                </div>
            </div>
        </div>
    </div>
  
    

    <div class="container">
        <div class="header pt-4">
            <div class="row align-items-center">
                <div class="col-6 col-md-8">
                    <img src="icons/logo.png" class="logo" onclick="openHomepage()">
                </div>
                <div class="col-6 col-md-4 text-end">
                    <a href="index.html" class="btn btn-sm btn-primary"><i class="fas fa-arrow-left-long"></i> <span class="d-none d-sm-inline-block">Back</span></a>
                    <a href="#" class="btn btn-sm btn-primary" onclick="reloadCache();"><i class="fas fa-refresh"></i> <span class="d-none d-sm-inline-block">Cache</span></a>
                    <a href="#" class="d-none btn btn-sm btn-success updateBtn" onclick="checkUpdate(1)"><i class="fas fa-arrow-up-right-from-square"></i> <span class="d-none d-sm-inline-block">Update</span><i class="update-dot text-danger fas fa-circle"></i></a>
                </div>
            </div>
        </div>

        <div class="setting-card mt-3">
            <div class="setting-section-title">Connection</div>

            <div class="setting-field">
                <label for="host"><i class="fas fa-server"></i> Host</label>
                <input type="text" class="form-control" id="host" placeholder="kimai.example.com">
            </div>

            <div class="setting-field">
                <label for="token"><i class="fas fa-key"></i> API Token</label>
                <input type="password" class="form-control" id="token" placeholder="Enter your API token">
            </div>

            <div class="setting-actions mt-4">
                <a href="#" class="btn btn-outline-warning setting-btn" onclick="testConnection()">
                    <i class="fas fa-satellite-dish"></i> Test
                </a>
                <a href="#" class="btn btn-primary setting-btn" onclick="saveSetting()">
                    <i class="fas fa-save"></i> Save
                </a>
            </div>
        </div>

        <div class="setting-hint mt-3">
            <i class="fas fa-circle-info"></i>
            Go to your Kimai profile and copy the <strong>host URL</strong> and your <strong>API token</strong>.
            <span class="setting-hint-link" onclick="window.open('https://github.com/owlysk/CodeTimer-Mobile','_system');">
                <i class="fab fa-github"></i> GitHub
            </span>
        </div>
    </div>

    <div class="footer text-center">
        <div class="d-none">v. <span class="app-version">0.0.0</span></div>
        &copy; 2025 Martin Lačný - Owly
    </div>

    <script src="cordova.js"></script>

    <script src="js/main.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/API.js"></script>
    <script src="js/setting.js"></script>
  </body>
</html>
